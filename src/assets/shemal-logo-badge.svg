      <stop offset="45%" stop-color="#f6c453"/>
      <stop offset="100%" stop-color="#b5790e"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="600" height="750" fill="url(#bgVignette)"/>

  <path d="M300 80 C395 215 445 300 445 365 C445 440 380 495 300 495 C220 495 155 440 155 365 C155 300 205 215 300 80 Z"
