<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-label="Shemal Petroleum">
  <title>Shemal Petroleum</title>
  <defs>
    <radialGradient id="bgVignette" cx="50%" cy="38%" r="75%">
