      <stop offset="60%" stop-color="#081633"/>
      <stop offset="100%" stop-color="#040a1c"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#fff6da"/>
      <stop offset="25%" stop-color="#f3ce6b"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#a9781f"/>
      <stop offset="100%" stop-color="#f3ce6b"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
