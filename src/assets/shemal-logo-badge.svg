  <g stroke="url(#goldStroke)" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M350 258 L382 205 L414 258"/>
    <line x1="335" y1="195" x2="428" y2="212" stroke-width="7"/>
    <path d="M428 212 q13 -2 15 11"/>
  </g>
  <circle cx="382" cy="207" r="6" fill="url(#goldText)"/>
  <circle cx="335" cy="195" r="9" fill="url(#goldText)"/>
  <rect x="340" y="256" width="84" height="8" rx="3" fill="url(#goldText)"/>

  <text x="300" y="415" text-anchor="middle" direction="rtl"
